name: Inspect citation pilot PDFs (temporary)
on:
  push:
    branches:
      - work/citation-pilot-2026-11-02
    paths:
      - .github/workflows/citation-pilot-inspect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            citation-val/sources/PDFs
            citation-val/evals
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Inspect original PDF bytes
        run: python citation-val/evals/inspect_pdfs.py
      - name: Render candidate evidence pages for visual inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          src = Path('citation-val/sources/PDFs')
          out = Path('citation-val/evals/_previews')
          out.mkdir(parents=True,exist_ok=True)
          selections = {
            'tata-motors-q3-fy25-results.pdf':[23,45,46],
            'ecos-india-mobility-drhp-addendum-2024.pdf':[5],
            'ieema_industry_apr-dec_2023.pdf':[2,8],
            'salvador-mica-ar-2022-23.pdf':[3],
            'airo-lam-abridged-rhp-bid-application-form.pdf':[2,3,7,11],
            'mapro_industries_reg29_share_sale_2026.pdf':[1],
          }
          for name, nums in selections.items():
            doc = fitz.open(src/name)
            for num in nums:
              pix=doc[num-1].get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              path=out/(name[:-4]+'_p'+str(num)+'.png')
              pix.save(path)
              print(path)
          PY
      - name: Publish temporary inspection data to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citation-val/evals/_inspection_report.json citation-val/evals/_previews
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save source PDF inspection report'
            git push
          fi

name: Inspect citation pilot PDFs (temporary)
on:
  push:
    branches:
      - work/citation-pilot-2026-11-02
    paths:
      - .github/workflows/citation-pilot-inspect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            citation-val/sources/PDFs
            citation-val/evals
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Inspect original PDF bytes
        run: python citation-val/evals/inspect_pdfs.py
      - name: Publish temporary inspection data to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citation-val/evals/_inspection_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save source PDF inspection report'
            git push
          fi
